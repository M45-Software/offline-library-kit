name: Security and dependency checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test and vet desktop core
        working-directory: desktop
        run: |
          go test -race ./...
          go vet ./...
      - name: Check Go vulnerabilities
        working-directory: desktop
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Cross-build desktop core
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          for target in linux-amd64 windows-amd64 darwin-arm64 darwin-amd64; do
            CGO_ENABLED=0 GOOS="${target%-*}" GOARCH="${target#*-}" \
              go build -trimpath -o "$RUNNER_TEMP/core-$target" .
          done
      - name: Test Python tools and audit dependencies
        run: |
          python -m pip install -r requirements-audit.txt pip-audit==2.10.1
          python -m unittest discover -s tests
          pip-audit --requirement requirements-audit.txt --no-deps --disable-pip
      - name: Test shell and audit npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          for directory in desktop/shell desktop/signing; do
            (cd "$directory" && npm ci --ignore-scripts --no-audit --no-fund && npm audit)
          done
          npm --prefix desktop/shell test
